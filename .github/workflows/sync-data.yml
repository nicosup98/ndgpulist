name: Auto Sync GPU & Game Benchmarks

on:
  schedule:
    # Se ejecuta automáticamente todos los días a las 06:00 UTC
    - cron: '0 6 * * *'
  workflow_dispatch: # Permite ejecución manual desde la pestaña Actions en GitHub

permissions:
  contents: write

jobs:
  sync-benchmarks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run data synchronization script (Geekbench, PassMark, Vast.ai, Steam, PCGamingWiki, ProtonDB)
        run: npm run sync-data

      - name: Commit and push if data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/gpus.json src/data/games.json
          if git diff --staged --quiet; then
            echo "No hay cambios nuevos en los datasets."
          else
            git commit -m "chore(data): actualización automática de benchmarks y tarifas cloud"
            git push
          fi
